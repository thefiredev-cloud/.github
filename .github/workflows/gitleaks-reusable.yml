# Reusable secret scan. Call from any repo:
#   jobs:
#     gitleaks:
#       uses: thefiredev-cloud/.github/.github/workflows/gitleaks-reusable.yml@main
# A repo-local .gitleaks.toml wins; otherwise the shared config is used.
name: gitleaks-reusable
on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.21.2"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: thefiredev-cloud/.github
          path: .shared-github
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          # The version input is caller-controlled; accept only a plain x.y.z.
          [[ "$GITLEAKS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad gitleaks-version: $GITLEAKS_VERSION" >&2; exit 1; }
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CFG=.gitleaks.toml
          [ -f "$CFG" ] || CFG=.shared-github/gitleaks/gitleaks.toml
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
            gitleaks git --redact --config "$CFG" --log-opts="$RANGE" .
          else
            gitleaks git --redact --config "$CFG" .
          fi
